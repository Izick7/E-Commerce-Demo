<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-600">Admin Dashboard</h1>
    <a href="index.html" class="text-sm text-blue-600 underline">← Back to Store</a>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-8">

    <!-- Add Product Form -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-bold mb-3">Add Product</h2>
      <form id="addForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input name="title" placeholder="Title" required class="border rounded px-3 py-2" />
        <input name="price" type="number" placeholder="Price" required class="border rounded px-3 py-2" />
        <input name="category" placeholder="Category" required class="border rounded px-3 py-2" />
        <input name="thumbnail" placeholder="Image URL" class="border rounded px-3 py-2" />
        <textarea name="description" placeholder="Description" class="border rounded px-3 py-2 sm:col-span-2"></textarea>
        <button type="submit" class="bg-blue-600 text-white rounded px-4 py-2 sm:col-span-2">Add Product (POST)</button>
      </form>
    </section>

    <!-- Product List -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-bold mb-3">Products</h2>
      <div id="adminProducts" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- Activity Log -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-bold mb-3">Activity Log</h2>
      <ul id="activityLog" class="text-sm space-y-1"></ul>
    </section>

  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-20">
    <div class="bg-white rounded-lg p-6 max-w-lg w-full mx-4">
      <h2 class="text-lg font-bold mb-3">Edit Product</h2>
      <form id="editForm" class="grid grid-cols-1 gap-3">
        <input type="hidden" name="id" />
        <input name="title" placeholder="Title" class="border rounded px-3 py-2" />
        <input name="price" type="number" placeholder="Price" class="border rounded px-3 py-2" />
        <input name="category" placeholder="Category" class="border rounded px-3 py-2" />
        <div class="flex gap-2">
          <button type="submit" data-method="PUT" class="bg-green-600 text-white rounded px-4 py-2 flex-1">Full Update (PUT)</button>
          <button type="submit" data-method="PATCH" class="bg-yellow-500 text-white rounded px-4 py-2 flex-1">Quick Update (PATCH)</button>
        </div>
        <button type="button" id="cancelEdit" class="text-sm text-gray-500 underline">Cancel</button>
      </form>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
