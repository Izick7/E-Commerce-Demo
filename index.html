<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Demo</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white shadow p-4 flex flex-wrap gap-3 items-center justify-between sticky top-0 z-10">
    <h1 class="text-2xl font-bold text-blue-600">E-Shop Demo</h1>
    <div class="flex flex-wrap gap-2 items-center">
      <input id="searchInput" type="text" placeholder="Search products..." class="border rounded px-3 py-1.5 text-sm" />
      <select id="categoryFilter" class="border rounded px-3 py-1.5 text-sm">
        <option value="">All Categories</option>
      </select>
      <a href="admin.html" class="text-sm text-blue-600 underline">Admin Dashboard</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <div id="products" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <div class="flex items-center justify-center gap-4 mt-6">
      <button id="prevBtn" class="px-4 py-2 bg-blue-600 text-white rounded disabled:opacity-40">Previous</button>
      <span id="pageIndicator" class="text-sm font-medium"></span>
      <button id="nextBtn" class="px-4 py-2 bg-blue-600 text-white rounded disabled:opacity-40">Next</button>
    </div>
  </main>

  <!-- Product Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-20">
    <div class="bg-white rounded-lg p-6 max-w-lg w-full mx-4 relative">
      <button id="closeModal" class="absolute top-2 right-3 text-xl">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script type="module" src="./js/home.js"></script>
</body>
</html>
